name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cincin
          POSTGRES_PASSWORD: cincin
          POSTGRES_DB: cincin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cincin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cincin:cincin@localhost:5432/cincin_e2e

    steps:
      - uses: actions/checkout@v4

      # Test against the backend branch with the same name when there is one, else main
      - name: Pick backend ref
        id: backend
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/miczagami/cincin_backend.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: miczagami/cincin_backend
          ref: ${{ steps.backend.outputs.ref }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Start backend (migrated + seeded)
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: 4000
          CORS_ORIGIN: http://localhost:3000
          APP_URL: http://localhost:3000
          AGE_VERIFY_PROVIDER: mock
          CRON_ENABLED: "false"
          RATE_LIMIT_MAX: "100000"
          AUTH_RATE_LIMIT_MAX: "100000"
        run: |
          npm ci
          npx prisma migrate deploy
          node prisma/seed.js
          nohup node src/server.js > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && exit 0; sleep 1; done
          cat "$GITHUB_WORKSPACE/backend.log"; exit 1

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        env:
          BACKEND_LOG: ${{ github.workspace }}/backend.log
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            backend.log
          retention-days: 7
