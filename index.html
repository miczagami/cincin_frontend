<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Priority 6: SEO & Lighthouse meta tags -->
    <title>CinCin — play your palate</title>
    <meta name="description" content="Turn any bottle into a multiplayer guessing game. Scan it, guess the tasting notes, and see whose palate wins the table." />
    <meta name="theme-color" content="#241C18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CinCin" />

    <!-- Priority 6: Preconnect to critical origins (reduces DNS/TLS latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Brand font: Poppins (preloaded; the stylesheet itself is imported by global.css) -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      as="style"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Priority 6: Critical inline CSS for above-the-fold rendering
         Prevents FOUC and gives Lighthouse a styled FCP -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #241C18;
        color: #DDD2C0;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        overscroll-behavior: none;
      }
      #root {
        min-height: 100dvh;
      }
      /* Initial loading state before React hydrates */
      .cin-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        background: #241C18;
      }
      .cin-initial-loader img { width: 96px; height: auto; animation: cin-clink 1.4s ease-in-out infinite; }
      @keyframes cin-clink { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg) scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .cin-initial-loader img { animation: none; } }
      .cin-skip-link { position: absolute; top: -100%; }
    </style>
  </head>
  <body>
    <!-- Priority 6: Skip-to-content link for keyboard/screen reader users -->
    <a href="#main-content" class="cin-skip-link">Skip to content</a>

    <div id="root">
      <!-- Priority 6: Visible content before JS loads (improves FCP) -->
      <div class="cin-initial-loader" role="status" aria-label="Loading CinCin">
        <img src="/brand/cincin-mark.svg" alt="" width="96" height="48" />
      </div>
    </div>

    <!-- Priority 6: Noscript fallback (Lighthouse Best Practices) -->
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#241C18;color:#DDD2C0;font-family:'Poppins',sans-serif;text-align:center;padding:24px;">
        <div>
          <img src="/brand/cincin-logo.svg" alt="CinCin" width="160" style="margin-bottom:16px" />
          <p>JavaScript is required to run CinCin. Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
